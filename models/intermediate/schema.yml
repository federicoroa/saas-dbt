version: 2

models:
  - name: int_customer_mrr_summary
    description: "Intermediate rollup aggregating active MRR, subscription counts, and active plan details per customer."
    columns:
      - name: customer_id
        description: "Primary key for customer MRR aggregation."
        tests:
          - unique
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id

      - name: current_mrr
        description: "Sum of monthly recurring revenue across all active subscriptions."
        tests:
          - not_null

      - name: active_subscriptions_count
        description: "Total count of active subscriptions currently held by the customer."

      - name: first_subscription_date
        description: "Date of the customer's earliest subscription start."

      - name: latest_subscription_start_date
        description: "Most recent subscription start date for the customer."

      - name: latest_subscription_end_date
        description: "Most recent subscription end date for the customer, if any subscription has ended."

      - name: has_active_subscription
        description: "Flag indicating whether the customer currently holds at least one active subscription."

  - name: int_customer_support_summary
    description: "Intermediate rollup calculating support ticket volumes, open issue counts, resolution speeds, and CSAT averages per customer."
    columns:
      - name: customer_id
        description: "Primary key for support metrics aggregation."
        tests:
          - unique
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id

      - name: total_tickets_count
        description: "Total volume of support tickets submitted by the customer."

      - name: open_tickets_count
        description: "Number of tickets currently in an open or pending state."

      - name: high_priority_tickets_count
        description: "Number of tickets flagged as high priority or urgent."

      - name: avg_csat_score
        description: "Average customer satisfaction rating across the customer's tickets."

  - name: int_customer_payments_summary
    description: "Intermediate rollup aggregating historical payments and lifetime revenue per customer."
    columns:
      - name: customer_id
        description: "Primary key for customer payment aggregation."
        tests:
          - unique
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id

      - name: lifetime_value
        description: "Cumulative historical revenue successfully processed from the customer."

      - name: total_successful_payments
        description: "Count of successful payment transactions."

      - name: first_payment_date
        description: "Date of the customer's first successful payment."

      - name: last_payment_date
        description: "Date of the customer's most recent successful payment."

  - name: int_customer_usage_daily
    description: "Intermediate daily product activity model aggregating usage counts, feature events, and engagement durations per customer and feature."
    columns:
      - name: daily_usage_id
        description: "Surrogate key composed of customer_id, event_date, and feature_name."
        tests:
          - unique
          - not_null

      - name: customer_id
        description: "Foreign key linking daily engagement back to stg_customers."
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id

      - name: event_date
        description: "Date when feature interactions took place."
        tests:
          - not_null

      - name: feature_name
        description: "Name of the product feature the usage events belong to."

      - name: total_usage_count
        description: "Sum of feature interactions on the given event_date."

      - name: total_duration_seconds
        description: "Sum of time spent (in seconds) on the feature on the given event_date."

      - name: total_events_count
        description: "Count of raw usage events rolled up into this daily/customer/feature row."
