version: 2

models:
  - name: dim_customer
    description: "Customer 360 dimension table aggregating customer profiles, active MRR, total historical payments, and support ticket metrics."
    columns:
      - name: customer_id
        description: "Primary key for individual customers."
        tests:
          - unique
          - not_null

      - name: current_mrr
        description: "Total active Monthly Recurring Revenue across all current subscriptions."
        tests:
          - not_null

      - name: lifetime_value
        description: "Cumulative historical revenue collected from successful payment transactions."

      - name: total_tickets_count
        description: "Total count of support tickets submitted by the customer."

      - name: open_tickets_count
        description: "Count of active support tickets currently in open or pending status."

  - name: fct_subscriptions
    description: "Finance and commercial fact table tracking active/churned subscription contracts, monthly recurring revenue, and duration."
    columns:
      - name: subscription_id
        description: "Primary key for individual subscription contracts."
        tests:
          - unique
          - not_null

      - name: customer_id
        description: "Foreign key linking subscription back to stg_customers."
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id

      - name: mrr
        description: "Monthly recurring revenue generated by the specific subscription."
        tests:
          - not_null

      - name: status
        description: "Current lifecycle state of the subscription (e.g., active, canceled, trial)."
        tests:
          - accepted_values:
              values: ['active', 'canceled', 'trial']

  - name: fct_daily_usage
    description: "Daily grain fact table of product feature usage per customer."
    columns:
      - name: daily_usage_id
        description: "Surrogate key composed of customer_id, event_date, and feature_name."
        tests:
          - unique
          - not_null

      - name: customer_id
        description: "Foreign key linking usage back to stg_customers."
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
